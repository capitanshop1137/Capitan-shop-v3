  <script>
    let allItems = [];
    let lightboxImages = [];
    let lightboxIndex = 0;

    function populateRankFilter() {
      const ranks = [...new Set(allItems.map(i => i.rank).filter(Boolean))];
      const select = document.getElementById('rankFilter');
      select.innerHTML = '<option value="all">همه رنک‌ها</option>';
      ranks.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = `🏆 ${r}`;
        select.appendChild(opt);
      });
    }

    async function loadAll() {
      const grid = document.getElementById('itemsGrid');
      try {
        allItems = await getFreefireAccounts();
        populateRankFilter();
        render();
      } catch (err) {
        grid.innerHTML = '<div class="loading" style="color:#FF2E88;">خطا: ' + err.message + '</div>';
      }
    }

    function openLightbox(imagesJson, startIndex) {
      try {
        const images = JSON.parse(decodeURIComponent(imagesJson));
        if (!images || images.length === 0) return;
        lightboxImages = images;
        lightboxIndex = startIndex || 0;
        document.getElementById('lightboxImg').src = images[lightboxIndex];
        document.getElementById('lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
        updateLightboxUI();
      } catch (e) { console.warn(e); }
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
      lightboxImages = [];
    }

    function changeLightboxSlide(direction) {
      if (lightboxImages.length === 0) return;
      lightboxIndex = (lightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
      updateLightboxUI();
    }

    function updateLightboxUI() {
      document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
      document.getElementById('lightboxCounter').textContent =
        `${(lightboxIndex + 1).toLocaleString('fa-IR')} / ${lightboxImages.length.toLocaleString('fa-IR')}`;
    }

    function buildSlider(images, cardId) {
      if (!images || images.length === 0) {
        return `<div class="slider"><div class="slider-slide">🔫</div></div>`;
      }
      const encodedImages = encodeURIComponent(JSON.stringify(images));
      const slidesHtml = images.map((url, i) =>
        `<div class="slider-slide" onclick="event.stopPropagation(); openLightbox('${encodedImages}', ${i})">
          <img src="${url}" alt="عکس" loading="lazy">
        </div>`
      ).join('');
      const dotsHtml = images.length > 1
        ? `<div class="slider-dots">${images.map((_, i) =>
            `<button class="slider-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide('${cardId}', ${i}, event)"></button>`
          ).join('')}</div>`
        : '';
      const navHtml = images.length > 1
        ? `<button class="slider-btn slider-btn-prev" onclick="changeSlide('${cardId}', -1, event)">‹</button>
           <button class="slider-btn slider-btn-next" onclick="changeSlide('${cardId}', 1, event)">›</button>
           <div class="slider-counter"><span class="current">۱</span> / ${images.length.toLocaleString('fa-IR')}</div>`
        : '';
      return `
        <div class="slider" id="slider-${cardId}" data-index="0" data-total="${images.length}">
          <div class="slider-track">${slidesHtml}</div>
          ${navHtml}
          ${dotsHtml}
        </div>
      `;
    }

    function changeSlide(cardId, direction, event) {
      if (event) event.stopPropagation();
      const slider = document.getElementById('slider-' + cardId);
      if (!slider) return;
      const total = parseInt(slider.dataset.total);
      let index = parseInt(slider.dataset.index);
      index = (index + direction + total) % total;
      updateSlider(slider, index);
    }

    function goToSlide(cardId, index, event) {
      if (event) event.stopPropagation();
      const slider = document.getElementById('slider-' + cardId);
      if (!slider) return;
      updateSlider(slider, index);
    }

    function updateSlider(slider, index) {
      slider.dataset.index = index;
      slider.querySelector('.slider-track').style.transform = `translateX(${index * 100}%)`;
      slider.querySelectorAll('.slider-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
      const counter = slider.querySelector('.slider-counter .current');
      if (counter) counter.textContent = (index + 1).toLocaleString('fa-IR');
    }

    function render() {
      const grid = document.getElementById('itemsGrid');
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const rank = document.getElementById('rankFilter').value;
      const status = document.getElementById('statusFilter').value;
      const minPrice = parseInt(document.getElementById('minPrice').value) || 0;
      const maxPrice = parseInt(document.getElementById('maxPrice').value) || Infinity;
      const sort = document.getElementById('sortFilter').value;

      let filtered = [...allItems];
      if (rank !== 'all') filtered = filtered.filter(i => i.rank === rank);
      if (status !== 'all') filtered = filtered.filter(i => i.status === status);
      if (minPrice > 0) filtered = filtered.filter(i => i.price_toman >= minPrice);
      if (maxPrice < Infinity) filtered = filtered.filter(i => i.price_toman <= maxPrice);
      if (search) {
        filtered = filtered.filter(i =>
          (i.title || '').toLowerCase().includes(search) ||
          (i.code || '').toLowerCase().includes(search)
        );
      }

      if (sort === 'cheapest') filtered.sort((a, b) => a.price_toman - b.price_toman);
      else if (sort === 'expensive') filtered.sort((a, b) => b.price_toman - a.price_toman);
      else filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      document.getElementById('resultsCount').textContent = `${filtered.length.toLocaleString('fa-IR')} اکانت پیدا شد`;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty"><span class="emoji">🔍</span><p>اکانتی پیدا نشد</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        let images = [];
        if (item.image_urls && Array.isArray(item.image_urls) && item.image_urls.length > 0) {
          images = item.image_urls;
        } else if (item.image_url) {
          images = [item.image_url];
        }
        const cardId = item.id;

        return `
          <div class="item-card ${item.status === 'sold' ? 'sold' : ''}">
            <div style="position: relative;">
              ${buildSlider(images, cardId)}
              ${item.rank ? `<span class="rank-badge">🏆 ${item.rank}</span>` : ''}
              <span class="status-badge ${item.status === 'available' ? 'status-available' : 'status-sold'}">
                ${item.status === 'available' ? '✅' : '❌'}
              </span>
            </div>
            <div class="body">
              <h3>${item.title}</h3>
              ${item.description ? `<div class="desc">${item.description}</div>` : ''}
              ${item.level ? `
                <div class="stats-row">
                  <div class="stat-box">
                    <div class="lbl">📊 لول</div>
                    <div class="val">${item.level.toLocaleString('fa-IR')}</div>
                  </div>
                </div>
              ` : ''}
              <div class="price-row">
                <div class="price-box">
                  <div class="lbl">💰 تومان</div>
                  <div class="val">${item.price_toman.toLocaleString('fa-IR')}</div>
                </div>
                ${item.price_dollar ? `
                  <div class="price-box" style="border-color: rgba(0, 255, 136, 0.2); background: rgba(0, 255, 136, 0.08);">
                    <div class="lbl">💵 دلار</div>
                    <div class="val" style="color: var(--neon-green);">$${parseFloat(item.price_dollar).toFixed(2)}</div>
                  </div>
                ` : ''}
              </div>
              <div class="meta">
                <span>🔢 کد ${item.code}</span>
              </div>
              ${item.status === 'available' ? `
                <div class="buy-label">🛒 برای خرید با مدیریت تماس بگیر:</div>
                <div style="display:flex; gap:8px;">
                  <a href="https://rubika.ir/FF_CaPiTaN_ShoP" target="_blank" class="contact" style="flex:1; font-size:12px; padding:10px;">👨‍💼 خرید در روبیکا</a>
                  <a href="tel:+989397855492" class="contact" style="flex:1; font-size:12px; padding:10px; background:linear-gradient(135deg, var(--neon-blue), #0090B8); color: #fff;">📞 تماس</a>
                </div>
              ` : `
                <div class="contact" style="background:rgba(255,46,136,0.15);color:#FF2E88;border:1px solid rgba(255,46,136,0.3);box-shadow:none;cursor:not-allowed;margin-top:auto;">❌ فروش رفته</div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('rankFilter').value = 'all';
      document.getElementById('statusFilter').value = 'all';
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      document.getElementById('sortFilter').value = 'newest';
      render();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('rankFilter').addEventListener('change', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('minPrice').addEventListener('input', render);
    document.getElementById('maxPrice').addEventListener('input', render);
    document.getElementById('sortFilter').addEventListener('change', render);

    loadAll();
  </script>
</body>
</html>
